<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>claude-cluster · terminal</title>
<style>
:root { --bg: #15171b; --surface: #1e2126; --line: #30343b; --text: #e6e7ea; --muted: #9aa0ab; --accent: #e08a55; --error: #ef6b5b; --ok: #5cc27a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
#bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line); height: 40px; }
#bar b { color: var(--accent); } #bar .muted { color: var(--muted); font-size: 12px; } #bar .grow { flex: 1; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: inherit; font: inherit; cursor: pointer; }
button:hover { border-color: var(--accent); } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#term { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; outline: none; }
#screen { display: block; width: 100%; height: 100%; cursor: text; }
.veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 420px; width: 100%; }
.card h2 { margin: 0 0 8px; } .card p { margin: 0 0 12px; color: var(--muted); } .card input { width: 100%; margin: 6px 0 12px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: inherit; font: inherit; }
.card .error { color: var(--error); margin-top: 8px; } .hidden { display: none; }
body:fullscreen #bar { display: none; } body:fullscreen #term { top: 0; }
</style>
</head>
<body>
<div id="bar">
    <b>claude-cluster</b><span class="muted">terminal</span><span id="status" class="muted"></span><span class="grow"></span>
    <span id="hint" class="muted">Ctrl+T / N / W: fullscreen (⛶) locks the keyboard (Chrome); else Alt+T / N / W</span>
    <button id="full" title="fullscreen, the keyboard locked: every key goes to the terminal (F11 to leave)">⛶</button>
    <button id="again" class="hidden">Reconnect</button>
    <button id="page" title="the page (the sessions, the grid, the settings)">Page</button>
    <button id="logout">Log out</button>
</div>
<div id="term" tabindex="0"><canvas id="screen"></canvas></div>
<div id="login" class="veil hidden"><form class="card" id="loginForm"><h2>claude-cluster</h2><p>The 6-digit code shown on the computer (its web line), then its approval.</p>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="code" maxlength="7"><input id="name" placeholder="name of this device (optional)" maxlength="40">
    <button class="primary" type="submit">Connect</button><div id="loginError" class="error"></div></form></div>
<div id="closed" class="veil hidden"><div class="card"><h2>Terminal closed</h2><p id="closedWhy">The terminal interface quit (Ctrl+Q), or the connection was lost.</p><button class="primary" id="reopen">Open it again</button></div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---- the terminal: what claude-cluster --tty emits (SGR 24-bit, the cursor moved, lines erased, its modes) ----

    csi(seq) {

            case "F": this.x = 0; this.y = Math.max(0, this.y - n); break;
            case "G": this.x = Math.min(Math.max(n - 1, 0), this.cols - 1); break;

            case "L": for (let i = 0; i < n; i++) { this.grid.pop(); this.grid.splice(this.y, 0, Array.from({length: this.cols}, blank)); } break;
            case "M": for (let i = 0; i < n; i++) { this.grid.splice(this.y, 1); this.grid.push(Array.from({length: this.cols}, blank)); } break;

// ---- drawn on a canvas: a grid of cells, the font measured once ----
const canvas = $("screen");

    canvas.style.width = box.width + "px"; canvas.style.height = box.height + "px";
    const cols = Math.max(20, Math.floor(box.width / cellW)), rows = Math.max(5, Math.floor(box.height / cellH));

requestAnimationFrame(frame);

// ---- the computer: the terminal opened, its output read (long polls), the keys written ----
let next = 0, reading = false, writes = Promise.resolve(), opened = false;

function closed(why) { opened = false; $("closedWhy").textContent = why; $("closed").classList.remove("hidden"); $("again").classList.remove("hidden"); $("status").textContent = "closed"; }

$("again").addEventListener("click", () => open().catch((e) => closed(e.message)));
$("page").addEventListener("click", () => { location.href = location.protocol + "//" + location.hostname + ":" + (PAGE_PORT || "8787") + "/"; });
$("logout").addEventListener("click", async () => { try { await api("/api/tty/close", "{}"); await api("/api/logout", "{}"); } catch (e) { /* out anyway */ } showLogin("Logged out"); });

// ---- the keys: what a terminal sends ----

// the mouse: SGR reports when the terminal asked for it (clicks, the wheel, a drag)
function mouseCell(e) { const r = canvas.getBoundingClientRect(); return {x: Math.max(1, Math.floor((e.clientX - r.left) / cellW) + 1), y: Math.max(1, Math.floor((e.clientY - r.top) / cellH) + 1)}; }
let pressed = -1;
canvas.addEventListener("mousedown", (e) => { $("term").focus(); if (!term || !term.mouse) return; e.preventDefault(); const p = mouseCell(e); pressed = e.button; sendKeys(CSI + "<" + e.button + ";" + p.x + ";" + p.y + "M"); });
canvas.addEventListener("mouseup", (e) => { if (!term || !term.mouse) return; const p = mouseCell(e); sendKeys(CSI + "<" + e.button + ";" + p.x + ";" + p.y + "m"); pressed = -1; });
canvas.addEventListener("mousemove", (e) => { if (!term || !term.mouse || pressed < 0) return; const p = mouseCell(e); sendKeys(CSI + "<" + (32 + pressed) + ";" + p.x + ";" + p.y + "M"); });
canvas.addEventListener("wheel", (e) => { if (!term || !term.mouse) return; e.preventDefault(); const p = mouseCell(e); sendKeys(CSI + "<" + (e.deltaY < 0 ? 64 : 65) + ";" + p.x + ";" + p.y + "M"); }, {passive: false});
canvas.addEventListener("contextmenu", (e) => { if (term && term.mouse) e.preventDefault(); });
// fullscreen: the keyboard locked (Chrome / Edge): Ctrl+T, Ctrl+N, Ctrl+W reach the terminal
$("full").addEventListener("click", async () => {
    try {
        await document.documentElement.requestFullscreen();
        if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
        $("term").focus();
    } catch (e) { $("status").textContent = "fullscreen refused: " + e.message; }
    setTimeout(fit, 100);
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); setTimeout(fit, 100); });
window.addEventListener("resize", () => { if (term) fit(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); if (term) fit(); }); // the font once loaded: the cells measured again
$("term").addEventListener("focus", () => { needDraw = true; });
$("term").addEventListener("blur", () => { needDraw = true; });

// ---- the login: the code, then the approval of the computer ----
function showLogin(error) { opened = false; $("login").classList.remove("hidden"); $("loginError").textContent = error || ""; $("pin").focus(); }
$("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
        const response = await fetch("/api/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pin: $("pin").value, name: $("name").value})});
        const data = await response.json().catch(() => ({}));
        if (response.status === 202 || data.state === "waiting") { $("loginError").textContent = "Waiting for the computer to approve this device…"; waitApproval(); return; }
        if (!response.ok) { $("loginError").textContent = data.error || response.statusText; return; }
        $("login").classList.add("hidden");
        open().catch((err) => closed(err.message));
    } catch (error) { $("loginError").textContent = error.message; }
});
async function waitApproval() {
    for (let i = 0; i < 180; i++) {
        await new Promise((r) => setTimeout(r, 1000));
        try {
            const state = await (await fetch("/api/login", {credentials: "same-origin", cache: "no-store"})).json();
            if (state.state === "connected") { $("login").classList.add("hidden"); open().catch((err) => closed(err.message)); return; }
            if (state.state === "denied" || state.state === "none") { $("loginError").textContent = "Refused by the computer."; return; }
        } catch (e) { /* again */ }
    }
}
const PAGE_PORT = "__PAGE_PORT__";
(async () => {
    try {
        const state = await (await fetch("/api/login", {credentials: "same-origin", cache: "no-store"})).json();
        if (state.state === "connected") open().catch((err) => closed(err.message));
        else showLogin("");
    } catch (e) { showLogin(e.message); }
})();
</script>
