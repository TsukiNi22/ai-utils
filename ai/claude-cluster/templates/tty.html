<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>claude-cluster · terminal</title>
<style>
:root { --bg: #15171b; --surface: #1e2126; --line: #30343b; --text: #e6e7ea; --muted: #9aa0ab; --accent: #e08a55; --error: #ef6b5b; --ok: #5cc27a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
#bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line); height: 40px; }
#bar b { color: var(--accent); } #bar .muted { color: var(--muted); font-size: 12px; } #bar .grow { flex: 1; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: inherit; font: inherit; cursor: pointer; }
button:hover { border-color: var(--accent); } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#term { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; outline: none; }
#screen { display: block; width: 100%; height: 100%; cursor: text; }
.veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 420px; width: 100%; }
.card h2 { margin: 0 0 8px; } .card p { margin: 0 0 12px; color: var(--muted); } .card input { width: 100%; margin: 6px 0 12px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: inherit; font: inherit; }
.card .error { color: var(--error); margin-top: 8px; } .hidden { display: none; }
body:fullscreen #bar { display: none; } body:fullscreen #term { top: 0; }
</style>
</head>
<body>
<div id="bar">
    <b>claude-cluster</b><span class="muted">terminal</span><span id="status" class="muted"></span><span class="grow"></span>
    <span id="hint" class="muted">Ctrl+T / N / W: fullscreen (⛶) locks the keyboard (Chrome); else Alt+T / N / W</span>
    <button id="full" title="fullscreen, the keyboard locked: every key goes to the terminal (F11 to leave)">⛶</button>
    <button id="again" class="hidden">Reconnect</button>
    <button id="page" title="the page (the sessions, the grid, the settings)">Page</button>
    <button id="logout">Log out</button>
</div>
<div id="term" tabindex="0"><canvas id="screen"></canvas></div>
<div id="login" class="veil hidden"><form class="card" id="loginForm"><h2>claude-cluster</h2><p>The 6-digit code shown on the computer (its web line), then its approval.</p>

    <button class="primary" type="submit">Connect</button><div id="loginError" class="error"></div></form></div>
<div id="closed" class="veil hidden"><div class="card"><h2>Terminal closed</h2><p id="closedWhy">The terminal interface quit (Ctrl+Q), or the connection was lost.</p><button class="primary" id="reopen">Open it again</button></div></div>

    if (f.x !== undefined) { view.x = f.x; view.y = f.y; view.cursor = f.cur; view.mouse = f.mouse; view.paste = f.paste; }
    frames++; needDraw = true;
    if (f.alive === false) { mode = ""; closed(f.none ? "No terminal here: open it again." : "The terminal interface quit (Ctrl+Q), or was closed."); }
}
function connectWs(size) {
    return new Promise((resolve, reject) => {
        let up = false;
        const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/tty/ws?cols=" + size.cols + "&rows=" + size.rows);
        sock.binaryType = "arraybuffer";
        sock.onopen = () => { up = true; resolve(sock); };
        sock.onmessage = (e) => {
            let message;
            try { message = JSON.parse(e.data); } catch (error) { return; }
            if (message.t === "f") applyFrame(message);
            else if (message.t === "pong") { rtt = performance.now() - message.n; showStats(); }
        };
        sock.onclose = (e) => {
            if (!up) { reject(new Error("no WebSocket")); return; }
            if (ws !== sock) return; // replaced
            clearInterval(pinger);
            if (e.code === 4001) { opened = false; showLogin(""); return; }
            if (e.code === 1000 || mode !== "ws") { if (opened) closed(e.reason || "The terminal was closed."); return; }
            // the connection lost (the network, the computer asleep): again, its terminal kept on the computer
            if (opened && retries < 5) { retries++; $("status").textContent = "reconnecting…"; setTimeout(() => open().catch((err) => closed(err.message)), 400 * retries); }
            else if (opened) closed("The connection was lost.");
        };
    });
}
async function open() {
    measure();
    const size = fit();
    $("closed").classList.add("hidden"); $("again").classList.add("hidden");
    try {
        if (!window.WebSocket) throw new Error("no WebSocket");
        view = {cols: size.cols, rows: size.rows, grid: Array.from({length: size.rows}, () => blankRow(size.cols)), x: 0, y: 0, cursor: true, mouse: false, paste: false};
        term = null;
        const sock = await connectWs(size);
        if (ws && ws !== sock) { try { ws.close(); } catch (e) { /* gone */ } }
        ws = sock; mode = "ws"; opened = true; retries = 0; allDirty = true;
        clearInterval(pinger);
        pinger = setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({t: "ping", n: performance.now()})); }, 2000);
        ws.send(JSON.stringify({t: "ping", n: performance.now()}));
    } catch (error) {
        // polling: the terminal opened, its output read by long polls (raw bytes, the emulator of this page)
        mode = "poll";
        term = new Term(size.cols, size.rows);
        view = term;
        const info = await api("/api/tty/open", JSON.stringify({cols: size.cols, rows: size.rows}));
        next = info.kept ? Math.max(0, info.next - 200000) : 0; // kept: the recent output drawn again
        opened = true;
        readLoop();
    }
    showStats();
    $("term").focus();
}
async function readLoop() {
    if (reading) return;
    reading = true;
    while (opened && mode === "poll") {
        let got;
        try { got = await api("/api/tty/read?from=" + next); } catch (error) { await new Promise((r) => setTimeout(r, 1000)); if (error.message === "not connected") break; continue; }
        if (got.data) { term.feedBytes(Uint8Array.from(atob(got.data), (c) => c.charCodeAt(0))); allDirty = true; needDraw = true; frames++; }
        next = got.next;
        if (!got.alive) { closed(got.none ? "No terminal here: open it again." : "The terminal interface quit (Ctrl+Q), or was closed."); break; }
    }
    reading = false;
}
function closed(why) {
    opened = false; clearInterval(pinger);
    if (ws) { const old = ws; ws = null; try { old.close(); } catch (e) { /* gone */ } }
    $("closedWhy").textContent = why; $("closed").classList.remove("hidden"); $("again").classList.remove("hidden"); $("status").textContent = "closed";
}
$("reopen").addEventListener("click", () => { retries = 0; open().catch((e) => closed(e.message)); });
$("again").addEventListener("click", () => { retries = 0; open().catch((e) => closed(e.message)); });
$("page").addEventListener("click", () => { location.href = location.protocol + "//" + location.hostname + ":" + (PAGE_PORT || "8787") + "/"; });
$("logout").addEventListener("click", async () => { opened = false; if (ws) ws.close(); try { await api("/api/tty/close", "{}"); await api("/api/logout", "{}"); } catch (e) { /* out anyway */ } showLogin("Logged out"); });

// ---- the keys: what a terminal sends ----
const CSI = "\x1b[";
function keyBytes(e) {
    const ctrl = e.ctrlKey, alt = e.altKey, shift = e.shiftKey, meta = e.metaKey;
    const mod = 1 + (shift ? 1 : 0) + (alt ? 2 : 0) + (ctrl ? 4 : 0);
    const arrow = {ArrowUp: "A", ArrowDown: "B", ArrowRight: "C", ArrowLeft: "D", Home: "H", End: "F"}[e.key];
    if (arrow) return mod === 1 ? CSI + arrow : CSI + "1;" + mod + arrow;
    const tilde = {PageUp: 5, PageDown: 6, Delete: 3, Insert: 2, F5: 15, F6: 17, F7: 18, F8: 19, F9: 20, F10: 21, F11: 23, F12: 24}[e.key];
    if (tilde) return mod === 1 ? CSI + tilde + "~" : CSI + tilde + ";" + mod + "~";
    const fn = {F1: "P", F2: "Q", F3: "R", F4: "S"}[e.key];
    if (fn) return mod === 1 ? "\x1bO" + fn : CSI + "1;" + mod + fn;
    if (e.key === "Enter") return alt || shift ? "\x1b\r" : "\r";
    if (e.key === "Backspace") return alt ? "\x1b\x7f" : "\x7f";
    if (e.key === "Tab") return shift ? CSI + "Z" : "\t";
    if (e.key === "Escape") return "\x1b";
    if (e.key.length !== 1 || meta) return null;
    if (ctrl && shift && (e.key === "V" || e.key === "C" || e.key === "v" || e.key === "c")) return null; // the browser pastes / copies, like a terminal
    if (ctrl) {
        const c = e.key.toLowerCase();
        if (c >= "a" && c <= "z") return String.fromCharCode(c.charCodeAt(0) - 96);
        const special = {" ": "\x00", "[": "\x1b", "\\": "\x1c", "]": "\x1d", "^": "\x1e", "_": "\x1f", "/": "\x1f"}[c];
        return special === undefined ? null : special;
    }
    return alt ? "\x1b" + e.key : e.key;
}
$("term").addEventListener("keydown", (e) => {
    if (!opened) return;
    const bytes = keyBytes(e);
    if (bytes === null) return;
    e.preventDefault(); e.stopPropagation();
    sendKeys(bytes);
});
$("term").addEventListener("paste", (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (!text) return;
    e.preventDefault();
    sendKeys(view && view.paste ? "\x1b[200~" + text + "\x1b[201~" : text);
});
// the mouse: SGR reports when the terminal asked for it (clicks, the wheel, a drag)
function mouseCell(e) { const r = canvas.getBoundingClientRect(); return {x: Math.max(1, Math.floor((e.clientX - r.left) / cellW) + 1), y: Math.max(1, Math.floor((e.clientY - r.top) / cellH) + 1)}; }
let pressed = -1;
canvas.addEventListener("mousedown", (e) => { $("term").focus(); if (!view || !view.mouse) return; e.preventDefault(); const p = mouseCell(e); pressed = e.button; sendKeys(CSI + "<" + e.button + ";" + p.x + ";" + p.y + "M"); });
canvas.addEventListener("mouseup", (e) => { if (!view || !view.mouse) return; const p = mouseCell(e); sendKeys(CSI + "<" + e.button + ";" + p.x + ";" + p.y + "m"); pressed = -1; });
canvas.addEventListener("mousemove", (e) => { if (!view || !view.mouse || pressed < 0) return; const p = mouseCell(e); sendKeys(CSI + "<" + (32 + pressed) + ";" + p.x + ";" + p.y + "M"); });
canvas.addEventListener("wheel", (e) => { if (!view || !view.mouse) return; e.preventDefault(); const p = mouseCell(e); sendKeys(CSI + "<" + (e.deltaY < 0 ? 64 : 65) + ";" + p.x + ";" + p.y + "M"); }, {passive: false});
canvas.addEventListener("contextmenu", (e) => { if (view && view.mouse) e.preventDefault(); });
// fullscreen: the keyboard locked (Chrome / Edge): Ctrl+T, Ctrl+N, Ctrl+W reach the terminal
$("full").addEventListener("click", async () => {
    try {
        await document.documentElement.requestFullscreen();
        if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
        $("term").focus();
    } catch (e) { $("status").textContent = "fullscreen refused: " + e.message; }
    setTimeout(fit, 100);
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); setTimeout(fit, 100); });
window.addEventListener("resize", () => { if (view) fit(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); if (view) fit(); }); // the font once loaded: the cells measured again
$("term").addEventListener("focus", () => { if (view) dirty.add(view.y); needDraw = true; });
$("term").addEventListener("blur", () => { if (view) dirty.add(view.y); needDraw = true; });

// ---- the login: the code, then the approval of the computer ----
function showLogin(error) { opened = false; $("login").classList.remove("hidden"); $("loginError").textContent = error || ""; $("pin").focus(); }
$("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
        const response = await fetch("/api/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pin: $("pin").value, name: $("name").value})});
        const data = await response.json().catch(() => ({}));
        if (response.status === 202 || data.state === "waiting") { $("loginError").textContent = "Waiting for the computer to approve this device…"; waitApproval(); return; }
        if (!response.ok) { $("loginError").textContent = data.error || response.statusText; return; }
        $("login").classList.add("hidden");
        open().catch((err) => closed(err.message));
    } catch (error) { $("loginError").textContent = error.message; }
});
async function waitApproval() {
    for (let i = 0; i < 180; i++) {
        await new Promise((r) => setTimeout(r, 1000));
        try {
            const state = await (await fetch("/api/login", {credentials: "same-origin", cache: "no-store"})).json();
            if (state.state === "connected") { $("login").classList.add("hidden"); open().catch((err) => closed(err.message)); return; }
            if (state.state === "denied" || state.state === "none") { $("loginError").textContent = "Refused by the computer."; return; }
        } catch (e) { /* again */ }
    }
}
const PAGE_PORT = "__PAGE_PORT__";
(async () => {
    try {
        const state = await (await fetch("/api/login", {credentials: "same-origin", cache: "no-store"})).json();
        if (state.state === "connected") open().catch((err) => closed(err.message));
        else showLogin("");
    } catch (e) { showLogin(e.message); }
})();
</script>
