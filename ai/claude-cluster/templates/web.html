<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>claude-cluster</title>
<style>
:root {
    --bg: #f6f6f4; --surface: #ffffff; --line: #deddd8; --text: #1d1d1b; --muted: #6d6c66; --accent: #c4632f;
    --ok: #2f8a4b; --warn: #b7791f; --error: #c0392b; --user: #eef1f6; --code: #f0efea; --pick: #f3e6dc;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #171715; --surface: #21201d; --line: #34332e; --text: #ecebe6; --muted: #9b9a92; --accent: #e08a55;
        --ok: #5cc27a; --warn: #e2b04a; --error: #ef6b5b; --user: #2a2c33; --code: #2b2a26; --pick: #3a2c22;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--error); }
input, textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); position: relative; }
label.field input { color: var(--text); font-size: 15px; }
.hidden { display: none !important; }
#login { display: flex; align-items: center; justify-content: center; height: 100%; padding: 16px; }
#login form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 340px; text-align: center; }
#login h1 { font-size: 20px; margin: 0 0 6px; }
#login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
#pin { width: 100%; text-align: center; font-size: 28px; letter-spacing: 6px; padding: 10px; margin-bottom: 14px; }
#login button { width: 100%; }
#loginError { color: var(--error); min-height: 20px; margin-top: 10px; font-size: 14px; }
#app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr; height: 100%; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; }
header .title { font-weight: 600; }
header .grow { flex: 1; }
header .muted { color: var(--muted); font-size: 13px; }
#settings { position: absolute; right: 14px; top: 52px; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: 290px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
#settings .note { color: var(--muted); font-size: 12px; }
#side { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.session { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.session:hover { background: var(--surface); }
.session.active { background: var(--surface); border-color: var(--line); }
.session .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.session .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.working { background: var(--ok); } .dot.waiting { background: var(--warn); } .dot.error { background: var(--error); }
.badge { background: var(--warn); color: #000; border-radius: 9px; font-size: 11px; padding: 0 6px; }
#newSession { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
#newSession .title { font-weight: 600; font-size: 13px; }
#external { display: flex; flex-direction: column; gap: 4px; max-height: 45vh; overflow-y: auto; }
#external .conv { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
#external .conv:hover { border-color: var(--accent); }
#external .conv small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
#sessionBar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#sessionBar .grow { flex: 1; }
#sessionBar .muted { color: var(--muted); font-size: 13px; }
#picker { display: none; }
#transcript { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 900px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: 12px; }
.msg.assistant { padding: 2px 0; }
.msg.tool, .msg.tool_result { color: var(--muted); font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.msg.system { color: var(--muted); font-size: 13px; font-style: italic; }
.msg.error { color: var(--error); }
.msg.display { border-left: 3px solid var(--line); padding-left: 10px; white-space: normal; }
.msg.display h4 { margin: 0 0 6px; color: var(--accent); }
.msg.display table { border-collapse: collapse; margin: 4px 0; font-size: 14px; }
.msg.display th, .msg.display td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.msg.display th { color: var(--accent); }
.msg.display img, .msg.display svg { max-width: 100%; height: auto; background: var(--surface); border-radius: 6px; }
.msg.display .callout { padding: 8px 10px; border-left: 3px solid; border-radius: 4px; background: var(--surface); }
.msg.display .bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; max-width: 420px; }
.msg.display .bar div { height: 100%; background: var(--accent); }
.msg.display .caption { color: var(--muted); font-size: 13px; font-style: italic; }
.msg pre { background: var(--code); padding: 8px 10px; border-radius: 8px; overflow-x: auto; font: 13px/1.4 ui-monospace, Menlo, monospace; white-space: pre; }
#ask, #pending { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
#ask .what { font-weight: 600; }
#ask .desc { color: var(--muted); font-size: 13px; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#ask label { display: block; padding: 4px 0; }
#ask label small { color: var(--muted); }
#pending .text { white-space: pre-wrap; }
#pending .when { color: var(--muted); font-size: 13px; }
#composer { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); align-items: flex-end; position: relative; }
#prompt { flex: 1; resize: none; min-height: 42px; max-height: 40vh; }
#mic { min-width: 46px; }
#mic.on { background: var(--error); border-color: var(--error); color: #fff; }
#mic.heard { box-shadow: 0 0 0 3px rgba(239, 107, 91, .35); }
#micState { color: var(--muted); font-size: 12px; padding: 0 14px 4px; min-height: 0; }
.complete { position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.18); min-width: 260px; }
.complete div { padding: 6px 10px; cursor: pointer; display: flex; gap: 10px; justify-content: space-between; }
.complete div small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.complete div.selected { background: var(--pick); }
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; max-width: 90%; z-index: 40; }
@media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    header { grid-column: 1; }
    #side { display: none; }
    #side.open { display: flex; position: fixed; top: 52px; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 5; }
    #picker { display: inline-block; }
    #who { display: none; }
}
</style>
</head>
<body>
<div id="login">
    <form id="loginForm" autocomplete="off">
        <h1>claude-cluster</h1>
        <p>The 6-digit code shown by claude-cluster on the computer</p>
        <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" autofocus>
        <button class="primary" type="submit">Connect</button>
        <div id="loginError"></div>
    </form>
</div>
<div id="app" class="hidden">
    <header>
        <button id="picker" title="Sessions">☰</button>
        <span class="title">claude-cluster</span>
        <span class="grow"></span>
        <span class="muted" id="who"></span>
        <button id="settingsButton" title="Voice settings">⚙</button>
        <button id="logout">Log out</button>
        <div id="settings" class="hidden">
            <label class="field">Microphone
                <select id="micMode">
                    <option value="push">Tap to talk (tap again to stop)</option>
                    <option value="auto">Hands-free (each sentence heard)</option>
                </select>
            </label>
            <label class="field">Answers read aloud
                <select id="sayMode">
                    <option value="off">Off</option>
                    <option value="server">Voice of claude-cluster</option>
                    <option value="device">Voice of this device</option>
                </select>
            </label>
            <div class="note" id="voiceNote"></div>
        </div>
    </header>
    <nav id="side">
        <div id="sessions"></div>
        <form id="newSession" autocomplete="off">
            <div class="title">New session</div>
            <label class="field">Folder it works in (from your home folder)
                <input id="newCwd" placeholder="~/projects/app" spellcheck="false">
            </label>
            <label class="field">Name (optional)
                <input id="newName" placeholder="app">
            </label>
            <button type="submit">Create the session</button>
            <button type="button" id="openExternal">Open a conversation of another agent…</button>
            <div id="external" class="hidden"></div>
        </form>
    </nav>
    <main id="main">
        <div id="sessionBar">
            <button id="sessionName" class="link" title="Sessions" style="border:none;background:none;padding:0;font-weight:600"></button>
            <span class="muted" id="sessionInfo"></span>
            <span class="grow"></span>
            <button id="fork" title="A copy of this session: its conversation so far, each one goes on apart">Fork</button>
            <button id="interrupt" title="Stop the turn and the reading">Stop</button>
            <button id="closeSession" class="danger" title="Close the session (to the trash)">Close</button>
        </div>
        <div id="transcript"></div>
        <div id="ask" class="hidden"></div>
        <div id="pending" class="hidden">
            <div class="text" id="pendingText"></div>
            <div class="row">
                <span class="when" id="pendingWhen"></span>
                <span style="flex:1"></span>
                <button id="pendingEdit">Edit</button>
                <button id="pendingCancel">Cancel</button>
                <button id="pendingSend" class="primary">Send now</button>
            </div>
        </div>
        <div id="micState"></div>
        <form id="composer">
            <button id="mic" type="button" title="Microphone">🎤</button>
            <textarea id="prompt" rows="1" placeholder="Message (Enter sends, Shift+Enter: new line, @ file, / command)" spellcheck="false"></textarea>
            <button class="primary" type="submit">Send</button>
        </form>
    </main>
</div>
<div id="toast" class="hidden"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
    get: (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } },
    set: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } },
};
let current = "g";
let version = 0;
let loop = 0;           // the loop of the state: a new one replaces the previous
let shownAsk = "";      // the permission shown (not rebuilt while it stays the same)
let lastKey = -1;
let voiceInfo = {available: false, confirm: 3, end_silence: 1.0};

function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.add("hidden"), 3500);
}

async function api(path, body) {
    const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
    const response = await fetch(path, Object.assign({credentials: "same-origin", cache: "no-store"}, options));
    const data = await response.json().catch(() => ({}));
    if (response.status === 401 && path !== "/api/login") { showLogin(); throw new Error("not connected"); }
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
}

async function cmd(request) {
    const data = await api("/api/cmd", request);
    if (data.ok === false) throw new Error(data.error || "failed");
    return data.data;
}

function showLogin(message) {
    loop++;
    stopMic();
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginError").textContent = message || "";
    $("pin").focus();
}

function showApp() {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    version = 0;
    run(++loop);
}

$("pin").addEventListener("input", (e) => {
    const digits = e.target.value.replace(/\D/g, "").slice(0, 6);
    e.target.value = digits.length > 3 ? digits.slice(0, 3) + " " + digits.slice(3) : digits;
});

$("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
        await api("/api/login", {pin: $("pin").value});
        $("pin").value = "";
        showApp();
    } catch (error) {
        $("loginError").textContent = error.message;
    }
});

$("logout").addEventListener("click", async () => {
    try { await api("/api/logout", {}); } catch (error) { /* already out */ }
    showLogin("Logged out");
});

async function run(id) {
    // the state, waited for by the server until something changes (15 s at most)
    while (id === loop) {
        try {
            const state = await api("/api/state?v=" + version + "&session=" + encodeURIComponent(current));
            if (id !== loop) return;
            version = state.version;
            $("who").textContent = "from " + state.client;
            if (state.voice) voiceInfo = state.voice;
            render(state);
        } catch (error) {
            if (id !== loop) return;
            await new Promise((r) => setTimeout(r, 2000));
        }
    }
}

function refresh() {
    version = 0;
    run(++loop);
}

function stateClass(state) {
    return state === "working" || state === "starting" ? "working" : state === "waiting" ? "waiting" : state === "error" ? "error" : "";
}

function render(state) {
    const list = $("sessions");
    list.textContent = "";
    for (const s of state.sessions) {
        const item = document.createElement("div");
        item.className = "session" + (s.id === current ? " active" : "");
        const name = document.createElement("div");
        name.className = "name";
        const dot = document.createElement("span");
        dot.className = "dot " + stateClass(s.state);
        name.append(dot, document.createTextNode(s.id === "g" ? "global" : s.name || s.id));
        if (s.permissions && s.permissions.length) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = s.permissions.length;
            name.append(badge);
        }
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = s.state + " · " + (s.cwd || "");
        item.append(name, sub);
        item.addEventListener("click", () => select(s.id));
        list.append(item);
    }
    const s = state.session;
    if (!s) {
        if (current !== "g") select("g");
        return;
    }
    $("sessionName").textContent = s.id === "g" ? "global" : s.name || s.id;
    $("sessionInfo").textContent = [s.state, s.model, s.mode, s.queued ? s.queued + " queued" : ""].filter(Boolean).join(" · ");
    $("closeSession").classList.toggle("hidden", s.id === "g");
    $("fork").classList.toggle("hidden", s.id === "g" || /^codex/.test(s.backend || ""));
    renderTranscript(s.messages || [], s.error);
    if (state.ask && (current === "g" || state.ask.session === current)) renderQuestion(state.ask);
    else renderAsk(s);
    readAnswer(s);
}

function select(id) {
    current = id;
    shownAsk = "";
    lastKey = -1;
    spoken.session = "";
    $("side").classList.remove("open");
    refresh();
}

function renderText(container, text) {
    // the code blocks apart (```), the rest as plain text
    text.split(/```[^\n]*\n?/).forEach((part, i) => {
        if (!part) return;
        if (i % 2) {
            const pre = document.createElement("pre");
            pre.textContent = part.replace(/\n$/, "");
            container.append(pre);
        } else {
            container.append(document.createTextNode(part));
        }
    });
}

// ---- the rich displays (MCP session_display): markdown, tables, charts (SVG), pictures (data: URLs, no script) ----
const displays = new Map();     // session:index:time -> the display whole (its picture asked once)

function inlineMarkdown(text) {
    // escaped, then **bold**, *italic*, `code`, [text](http...)
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

function markdown(text) {
    let html = "";
    let list = false;
    let code = null;
    for (const line of text.split("\n")) {
        if (line.startsWith("```")) {
            if (code === null) { code = []; continue; }
            const pre = document.createElement("pre");
            pre.textContent = code.join("\n");
            html += pre.outerHTML;
            code = null;
            continue;
        }
        if (code !== null) { code.push(line); continue; }
        const item = /^\s*[-*] (.*)/.exec(line);
        if (item && !list) { html += "<ul>"; list = true; }
        if (!item && list) { html += "</ul>"; list = false; }
        const heading = /^(#{1,4}) (.*)/.exec(line);
        if (item) html += "<li>" + inlineMarkdown(item[1]) + "</li>";
        else if (heading) html += "<h4>" + inlineMarkdown(heading[2]) + "</h4>";
        else if (line.trim()) html += "<p>" + inlineMarkdown(line) + "</p>";
    }
    if (list) html += "</ul>";
    return html;
}

function svgOf(tag, attrs) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
}

function chart(d) {
    // bars (grouped), lines, or a pie (the first series)
    const colors = ["var(--accent)", "var(--ok)", "var(--warn)", "var(--error)", "var(--text)"];
    const series = d.series || [];
    const labels = d.labels || [];
    const W = 640, H = 270, L = 46, B = 28, T = series.length > 1 ? 26 : 10, R = 10;
    const svg = svgOf("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H});
    const text = (x, y, s, anchor) => { const t = svgOf("text", {x, y, "font-size": 11, fill: "var(--muted)", "text-anchor": anchor || "middle"}); t.textContent = s; svg.append(t); };
    if (d.kind === "pie") {
        const values = (series[0] && series[0].values) || [];
        const total = values.reduce((a, v) => a + Math.max(0, +v || 0), 0) || 1;
        let angle = -Math.PI / 2;
        values.forEach((v, i) => {
            const share = Math.max(0, +v || 0) / total;
            const end = angle + share * 2 * Math.PI;
            const [x1, y1, x2, y2] = [130 + 110 * Math.cos(angle), 130 + 110 * Math.sin(angle), 130 + 110 * Math.cos(end), 130 + 110 * Math.sin(end)];
            svg.append(svgOf("path", {d: `M130,130 L${x1},${y1} A110,110 0 ${share > 0.5 ? 1 : 0},1 ${x2},${y2} Z`, fill: colors[i % colors.length]}));
            svg.append(svgOf("rect", {x: 270, y: 20 + i * 22, width: 12, height: 12, fill: colors[i % colors.length]}));
            text(290, 31 + i * 22, `${labels[i] !== undefined ? labels[i] : i + 1}  ${(share * 100).toFixed(1)}%`, "start");
            angle = end;
        });
        return svg;
    }
    let low = 0, high = 0;
    for (const s of series) for (const v of s.values || []) { low = Math.min(low, +v || 0); high = Math.max(high, +v || 0); }
    if (high <= low) high = low + 1;
    const count = Math.max(...series.map((s) => (s.values || []).length), 1);
    const slot = (W - L - R) / count;
    const y = (v) => T + (H - T - B) * (1 - ((+v || 0) - low) / (high - low));
    svg.append(svgOf("line", {x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "var(--line)"}));
    text(L - 6, T + 8, String(+high.toPrecision(4)), "end");
    text(L - 6, H - B, String(+low.toPrecision(4)), "end");
    series.forEach((s, k) => {
        const values = s.values || [];
        if (d.kind === "line") {
            const points = values.map((v, i) => `${L + slot * (i + 0.5)},${y(v)}`).join(" ");
            svg.append(svgOf("polyline", {points, fill: "none", stroke: colors[k % colors.length], "stroke-width": 2}));
        } else {
            const width = slot * 0.8 / series.length;
            values.forEach((v, i) => {
                const top = y(Math.max(0, +v || 0)), bottom = y(Math.min(0, +v || 0));
                svg.append(svgOf("rect", {x: L + slot * i + slot * 0.1 + width * k, y: top, width: Math.max(1, width - 2), height: Math.max(0, bottom - top), fill: colors[k % colors.length]}));
            });
        }
        if (series.length > 1) {
            svg.append(svgOf("rect", {x: L + k * 110, y: 4, width: 10, height: 10, fill: colors[k % colors.length]}));
            text(L + 15 + k * 110, 13, s.name || "", "start");
        }
    });
    labels.slice(0, count).forEach((l, i) => text(L + slot * (i + 0.5), H - B + 16, String(l)));
    return svg;
}

function picture(d) {
    const img = document.createElement("img");
    if (d.type === "image") img.src = `data:${d.mime || "image/png"};base64,${d.data || ""}`;
    else img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(d.svg || "")));
    img.alt = d.alt || d.type;
    return img;
}

function drawDisplay(div, d) {
    div.textContent = "";
    if (d.title) { const h = document.createElement("h4"); h.textContent = d.title; div.append(h); }
    const cell = (v) => (typeof v === "string" ? v : JSON.stringify(v));
    if (d.type === "markdown") div.insertAdjacentHTML("beforeend", markdown(d.text || ""));
    else if (d.type === "code") { const pre = document.createElement("pre"); pre.textContent = d.code || ""; div.append(pre); }
    else if (d.type === "callout") {
        const colors = {success: "var(--ok)", warning: "var(--warn)", error: "var(--error)"};
        const icons = {success: "✔ ", warning: "⚠ ", error: "✗ "};
        const box = document.createElement("div");
        box.className = "callout";
        box.style.borderColor = colors[d.level] || "var(--accent)";
        box.textContent = (icons[d.level] || "ℹ ") + (d.text || "");
        div.append(box);
    } else if (d.type === "progress") {
        const ratio = Math.max(0, Math.min(1, (+d.value || 0) / (+d.max || 100)));
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.style.width = (ratio * 100).toFixed(1) + "%";
        bar.append(fill);
        const label = document.createElement("small");
        label.textContent = Math.round(ratio * 100) + "%  " + (d.label || "");
        div.append(bar, label);
    } else if (d.type === "table") {
        const table = document.createElement("table");
        if (d.columns) { const tr = table.insertRow(); for (const c of d.columns) { const th = document.createElement("th"); th.textContent = cell(c); tr.append(th); } }
        for (const r of d.rows || []) { const tr = table.insertRow(); for (const c of Array.isArray(r) ? r : [r]) tr.insertCell().textContent = cell(c); }
        div.append(table);
    } else if (d.type === "chart") div.append(chart(d));
    else div.append(picture(d));
    const caption = d.alt || d.caption;
    if (caption && (d.type === "image" || d.type === "diagram" || d.type === "svg")) {
        const c = document.createElement("div");
        c.className = "caption";
        c.textContent = caption;
        div.append(c);
    }
}

function renderDisplay(div, m) {
    let d;
    try { d = JSON.parse(m.text); } catch (error) { div.textContent = "[display]"; return; }
    const key = current + ":" + m.index + ":" + m.time;
    if (!d.heavy) { drawDisplay(div, d); return; }
    if (displays.has(key)) { drawDisplay(div, displays.get(key)); return; }
    div.textContent = "…";
    fetch(`/api/display?session=${encodeURIComponent(current)}&index=${m.index}`, {credentials: "same-origin"})
        .then((r) => r.json()).then((full) => { displays.set(key, full); drawDisplay(div, full); })
        .catch(() => { div.textContent = "[" + d.type + " not loaded]"; });
}

function renderTranscript(messages, error) {
    const box = $("transcript");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const key = messages.length + ":" + (messages.length ? messages[messages.length - 1].text.length : 0) + ":" + (error || "");
    if (key === lastKey) return;
    const first = lastKey === -1;
    lastKey = key;
    box.textContent = "";
    for (const m of messages) {
        const div = document.createElement("div");
        div.className = "msg " + m.kind;
        if (m.kind === "display") renderDisplay(div, m);
        else renderText(div, m.kind === "tool" ? "▸ " + (m.tool ? m.tool + " " : "") + m.text : m.text);
        box.append(div);
    }
    if (error) {
        const div = document.createElement("div");
        div.className = "msg error";
        div.textContent = error;
        box.append(div);
    }
    if (atBottom || first) box.scrollTop = box.scrollHeight;
}

function renderQuestion(a) {
    // the question of an agent (one at a time, shared with the computer and its voice): choose, Other, next / answer, back, decline
    const box = $("ask");
    shownAsk = "";
    box.textContent = "";
    box.classList.remove("hidden");
    const q = a.questions[a.index];
    const options = q.options || [];
    const multi = !!q.multiSelect;
    const what = document.createElement("div");
    what.className = "what";
    what.textContent = a.name + " asks" + (a.questions.length > 1 ? " (" + (a.index + 1) + "/" + a.questions.length + ")" : "")
        + (a.session !== current ? " - it waits for your answer" : "");
    const question = document.createElement("div");
    question.textContent = q.question;
    question.style.fontWeight = "600";
    box.append(what, question);
    options.forEach((o, i) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = multi ? "checkbox" : "radio";
        input.name = "question";
        input.checked = multi ? (a.picked || []).includes(i) : a.cursor === i;
        input.addEventListener("change", () => act({cmd: "ask", action: "choose", option: i}));
        label.append(input, document.createTextNode(" " + (i + 1) + ". " + o.label + " "));
        if (o.description) { const d = document.createElement("small"); d.textContent = o.description; label.append(d); }
        box.append(label);
    });
    const other = document.createElement("input");
    other.placeholder = "Other (typed)";
    other.value = a.other || "";
    other.addEventListener("change", () => act({cmd: "ask", action: "other", text: other.value}));
    box.append(other);
    const row = document.createElement("div");
    row.className = "row";
    const button = (text, cls, request) => {
        const b = document.createElement("button");
        b.textContent = text;
        if (cls) b.className = cls;
        b.addEventListener("click", request);
        return b;
    };
    if (a.index > 0) row.append(button("Back", "", () => act({cmd: "ask", action: "back"})));
    row.append(button(a.index + 1 < a.questions.length ? "Next" : "Answer", "primary", async () => {
        if (other.value && other.value !== (a.other || "")) await cmd({cmd: "ask", action: "other", text: other.value});
        act({cmd: "ask", action: "next"});
    }), button("Decline", "danger", () => act({cmd: "ask", action: "decline"})));
    const hint = document.createElement("small");
    hint.textContent = "voice: a number or an option · valide / suivant · retour · autre <answer> · annule";
    hint.style.color = "var(--muted)";
    box.append(row, hint);
}

function renderAsk(s) {
    const box = $("ask");
    const p = (s.permissions || []).find((x) => x.tool !== "AskUserQuestion");
    if (!p) { box.classList.add("hidden"); box.textContent = ""; shownAsk = ""; return; }
    if (shownAsk === s.id + p.request_id) return;
    shownAsk = s.id + p.request_id;
    box.textContent = "";
    box.classList.remove("hidden");
    const what = document.createElement("div");
    what.className = "what";
    const row = document.createElement("div");
    row.className = "row";
    const button = (text, cls, request) => {
        const b = document.createElement("button");
        b.textContent = text;
        if (cls) b.className = cls;
        b.addEventListener("click", () => act(typeof request === "function" ? request() : request));
        return b;
    };
    if (p.questions) {
        what.textContent = "Question of the agent";
        box.append(what);
        const answers = [];
        p.questions.forEach((q, qi) => {
            const field = document.createElement("div");
            const title = document.createElement("div");
            title.textContent = q.question;
            title.style.fontWeight = "600";
            field.append(title);
            (q.options || []).forEach((o) => {
                const label = document.createElement("label");
                const input = document.createElement("input");
                input.type = q.multiSelect ? "checkbox" : "radio";
                input.name = "q" + qi;
                input.value = o.label;
                label.append(input, document.createTextNode(" " + o.label + " "));
                if (o.description) { const d = document.createElement("small"); d.textContent = o.description; label.append(d); }
                field.append(label);
            });
            const other = document.createElement("input");
            other.placeholder = "Other (typed)";
            field.append(other);
            answers.push(() => other.value.trim() || [...field.querySelectorAll("input:checked")].map((i) => i.value).join(", "));
            box.append(field);
        });
        row.append(button("Answer", "primary", () => {
            const result = {};
            p.questions.forEach((q, i) => { result[q.question] = answers[i](); });
            if (Object.values(result).some((v) => !v)) { toast("Answer every question"); return null; }
            return {cmd: "allow", session: s.id, request_id: p.request_id, answers: result};
        }), button("Decline", "", {cmd: "allow", session: s.id, request_id: p.request_id, behavior: "deny"}));
        box.append(row);
        return;
    }
    what.textContent = "Permission: " + p.tool;
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = p.description + (p.reason ? "\nwhy: " + p.reason : "");
    if (p.safety) what.textContent = "Stopped by the safety check of Claude Code: run it anyway?";
    row.append(button("Allow", "primary", {cmd: "allow", session: s.id, request_id: p.request_id, behavior: "allow"}),
        button("Deny", "danger", {cmd: "allow", session: s.id, request_id: p.request_id, behavior: "deny"}));
    box.append(what, desc, row);
}

async function act(request) {
    if (!request) return null;
    try {
        const data = await cmd(request);
        if (data && data.message) toast(data.message);
        shownAsk = "";
        refresh();
        return data;
    } catch (error) {
        toast(error.message);
        return null;
    }
}

async function send(text) {
    text = text.trim();
    if (!text) return;
    stopReading();
    await act({cmd: "send", session: current, text: text});
}

$("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("prompt").value;
    $("prompt").value = "";
    autosize();
    closeComplete();
    await send(text);
});

function autosize() {
    const p = $("prompt");
    p.style.height = "auto";
    p.style.height = Math.min(p.scrollHeight, window.innerHeight * 0.4) + "px";

    const box = $("external");
    if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
    box.textContent = "…";
    box.classList.remove("hidden");
    try {
        const list = await cmd({cmd: "external", limit: 40});
        box.textContent = "";
        if (!list.length) box.textContent = "No conversation of another agent";
        const names = {claude: "Claude Code", codex: "Codex", opencode: "opencode", qwen: "Qwen Code"};
        for (const c of list) {
            const item = document.createElement("div");
            item.className = "conv";
            const where = document.createElement("small");
            where.textContent = (names[c.agent] || c.agent) + " · " + c.age + " ago · " + c.cwd;
            item.append(document.createTextNode(c.title), where);
            item.title = c.first_prompt;
            item.addEventListener("click", async () => {
                // used less than 2 min ago: maybe still open elsewhere, a copy
                const recent = Date.now() / 1000 - c.updated < 120;
                const data = await act({cmd: "import", agent: c.agent, id: c.id, fork: recent});
                if (data && data.id) { box.classList.add("hidden"); select(data.id); }

// ---- completion: @file, /command, the argument of /cd /new /mode /model /effort /restore, the folder of a new session ----
const completion = {box: null, items: [], selected: 0, input: null, start: 0, end: 0, kind: "", timer: 0, seq: 0};

function context(input) {
    const text = input.value;
    const cursor = input.selectionStart;
    if (input.id === "newCwd") return {kind: "folder", query: text.slice(0, cursor), start: 0, end: cursor, session: ""};
    const before = text.slice(0, cursor);
    const word = before.match(/(?:\\ |[^\s])*$/)[0];
    const start = cursor - word.length;
    const head = before.slice(0, start).trim();
    if (word.startsWith("@")) return {kind: "file", query: word.slice(1), start: start + 1, end: cursor, session: current};
    if (word.startsWith("/") && !head) return {kind: "command", query: word.slice(1), start: start + 1, end: cursor, session: current};
    const kinds = {"/cd": "folder", "/new": "folder", "/mode": "mode", "/model": "model", "/effort": "effort", "/restore": "trash"};
    if (kinds[head] && !before.slice(0, start).trim().includes(" ")) return {kind: kinds[head], query: word, start: start, end: cursor, session: current};
    return null;
}

function closeComplete() {
    if (completion.box) completion.box.remove();
    completion.box = null;
    completion.items = [];
}

function suggest(input) {
    clearTimeout(completion.timer);
    const ctx = context(input);
    if (!ctx || (input.id === "prompt" && !ctx.kind)) { closeComplete(); return; }
    completion.timer = setTimeout(async () => {
        const seq = ++completion.seq;
        try {
            const data = await api("/api/complete", {session: ctx.session, kind: ctx.kind, query: ctx.query});
            if (seq !== completion.seq) return;
            Object.assign(completion, {input: input, start: ctx.start, end: ctx.end, kind: ctx.kind, items: data.items || [], selected: 0});
            drawComplete();
        } catch (error) { closeComplete(); }
    }, 120);
}

function drawComplete() {
    if (completion.box) completion.box.remove();
    completion.box = null;
    if (!completion.items.length) return;
    const box = document.createElement("div");
    box.className = "complete";
    completion.items.forEach((item, i) => {
        const row = document.createElement("div");
        if (i === completion.selected) row.className = "selected";
        const label = document.createElement("span");
        label.textContent = item.label;
        const desc = document.createElement("small");
        desc.textContent = item.description || "";
        row.append(label, desc);
        row.addEventListener("mousedown", (e) => { e.preventDefault(); completion.selected = i; accept(); });
        box.append(row);
    });
    const input = completion.input;
    const anchor = input.id === "prompt" ? $("composer") : input.parentElement;
    anchor.append(box);
    completion.box = box;
    if (input.id === "prompt") { box.style.left = "14px"; box.style.right = "14px"; box.style.bottom = "100%"; }
    else { box.style.left = "0"; box.style.right = "0"; box.style.top = "100%"; }
    const selected = box.children[completion.selected];
    if (selected) selected.scrollIntoView({block: "nearest"});
}

function accept() {
    const item = completion.items[completion.selected];
    if (!item) return;
    const input = completion.input;
    const text = input.value;
    const after = item.directory || completion.kind === "folder" && item.value.endsWith("/") ? "" : " ";
    input.value = text.slice(0, completion.start) + item.value + after + text.slice(completion.end);
    const cursor = completion.start + item.value.length + after.length;
    input.setSelectionRange(cursor, cursor);
    input.focus();
    closeComplete();
    if (input.id === "prompt") autosize();
    if (!after) suggest(input); // a folder: its content next
}

for (const input of [$("prompt"), $("newCwd")]) {
    input.addEventListener("input", () => { if (input.id === "prompt") autosize(); suggest(input); });
    input.addEventListener("click", () => suggest(input));
    input.addEventListener("blur", () => setTimeout(() => { if (completion.input === input) closeComplete(); }, 150));
    input.addEventListener("keydown", (e) => {
        const open = completion.box && completion.input === input && completion.items.length;
        if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            const n = completion.items.length;
            completion.selected = (completion.selected + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
            drawComplete();
        } else if (open && (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey))) {
            e.preventDefault();
            accept();
        } else if (open && e.key === "Escape") {
            e.preventDefault();
            closeComplete();
        } else if (input.id === "prompt" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            $("composer").requestSubmit();
        }
    });
}

// ---- voice: the microphone (each sentence to claude-cluster, recognized by its speech model) ----
const mic = {stream: null, context: null, node: null, on: false, chunks: [], rate: 48000, speaking: false, silent: 0,
    voiced: 0, noise: 0.005, before: [], queue: Promise.resolve()};
const pending = {text: "", deadline: 0, paused: false, timer: 0};

function micState(text) { $("micState").textContent = text || ""; }

async function startMic() {
    if (!window.isSecureContext) { toast("The microphone needs https (settings page > Web > HTTPS)"); return; }
    if (!voiceInfo.available) { toast("No voice in this claude-cluster"); return; }
    stopReading();
    try {
        mic.stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, channelCount: 1}});
    } catch (error) {
        toast("Microphone refused: " + error.message);
        return;
    }
    mic.context = new (window.AudioContext || window.webkitAudioContext)();
    mic.rate = mic.context.sampleRate;
    const source = mic.context.createMediaStreamSource(mic.stream);
    mic.node = mic.context.createScriptProcessor(4096, 1, 1);
    mic.node.onaudioprocess = (e) => onAudio(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(mic.node);
    mic.node.connect(mic.context.destination);
    Object.assign(mic, {on: true, chunks: [], speaking: false, silent: 0, voiced: 0, before: []});
    $("mic").classList.add("on");
    micState(store.get("micMode", "push") === "auto" ? "listening: speak, each sentence is taken" : "listening: tap 🎤 again when done");
}

function stopMic(keep) {
    if (!mic.on) return;
    mic.on = false;
    if (keep && mic.chunks.length) utterance(mic.chunks);
    mic.chunks = [];
    if (mic.node) mic.node.disconnect();
    if (mic.stream) mic.stream.getTracks().forEach((t) => t.stop());
    if (mic.context) mic.context.close();
    $("mic").classList.remove("on", "heard");
    if (!keep) micState("");
}

function onAudio(samples) {
    if (!mic.on || reading.active) return; // the answer read: not heard back
    let sum = 0;
    for (const s of samples) sum += s * s;
    const level = Math.sqrt(sum / samples.length);
    const seconds = samples.length / mic.rate;
    if (store.get("micMode", "push") === "push") { mic.chunks.push(samples); return; }
    // hands-free: a sentence from a little before the voice to end_silence of silence after it
    const voice = level > Math.max(mic.noise * 3, 0.012);
    if (!mic.speaking) {
        mic.before.push(samples);
        if (mic.before.length * seconds > 0.6) mic.before.shift();
        if (!voice) { mic.noise = 0.95 * mic.noise + 0.05 * Math.min(level, mic.noise * 3 + 0.001); return; }
        mic.speaking = true;
        mic.chunks = mic.before.slice();
        mic.before = [];
        mic.silent = 0;
        mic.voiced = 0;
        pausePending(true);
        $("mic").classList.add("heard");
    }
    mic.chunks.push(samples);
    if (voice) { mic.silent = 0; mic.voiced += seconds; } else { mic.silent += seconds; }
    const length = mic.chunks.length * seconds;
    if (mic.silent >= (voiceInfo.end_silence || 1.0) || length > 30) {
        const chunks = mic.chunks;
        mic.speaking = false;
        mic.chunks = [];
        $("mic").classList.remove("heard");
        if (mic.voiced >= 0.3) utterance(chunks); else pausePending(false);
    }
}

function wav(chunks, rate) {
    // 16 kHz, 16 bits, mono
    let length = 0;
    for (const c of chunks) length += c.length;
    const all = new Float32Array(length);
    let at = 0;
    for (const c of chunks) { all.set(c, at); at += c.length; }
    const ratio = rate / 16000;
    const out = new Int16Array(Math.floor(all.length / ratio));
    for (let i = 0; i < out.length; i++) {
        const from = Math.floor(i * ratio);
        const to = Math.min(all.length, Math.floor((i + 1) * ratio));
        let sum = 0;
        for (let j = from; j < to; j++) sum += all[j];
        const v = Math.max(-1, Math.min(1, sum / Math.max(1, to - from)));
        out[i] = v < 0 ? v * 32768 : v * 32767;
    }
    const buffer = new ArrayBuffer(44 + out.length * 2);
    const view = new DataView(buffer);
    const text = (offset, s) => { for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i)); };
    text(0, "RIFF"); view.setUint32(4, 36 + out.length * 2, true); text(8, "WAVE"); text(12, "fmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, 16000, true);
    view.setUint32(28, 32000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, "data");
    view.setUint32(40, out.length * 2, true);
    new Int16Array(buffer, 44).set(out);
    return new Blob([buffer], {type: "audio/wav"});
}

function utterance(chunks) {
    const body = wav(chunks, mic.rate);
    micState("recognizing…");
    // one after the other: the texts in the order they were said
    mic.queue = mic.queue.then(async () => {
        try {
            const response = await fetch("/api/listen", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "audio/wav"}, body: body});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || response.statusText);
            if (data.question) { toast(data.question); refresh(); }
            else heard(data.text || "", data.word || "");
        } catch (error) {
            toast("Not recognized: " + error.message);
            pausePending(false);
        }
        micState(mic.on ? (store.get("micMode", "push") === "auto" ? "listening: speak, each sentence is taken" : "listening") : "");
    });
}

function heard(text, word) {
    // a cancel / send word said alone acts on what waits; the rest waits confirm seconds (paused while you speak)
    if (word === "cancel") {
        if (pending.text) { clearPending(); toast("Dropped"); }
        else { stopReading(); act({cmd: "interrupt", session: current}); toast("Stopped"); }
        return;
    }
    if (word === "send") { if (pending.text) sendPending(); return; }
    if (!text.replace(/[.,!?…\s]/g, "")) { pausePending(false); return; }
    pending.text = pending.text ? pending.text + " " + text : text;
    if (!voiceInfo.confirm) { sendPending(); return; }
    pending.deadline = Date.now() + voiceInfo.confirm * 1000;
    pending.paused = false;
    drawPending();
}

function pausePending(paused) {
    if (!pending.text) return;
    pending.paused = paused;
    if (!paused) pending.deadline = Date.now() + voiceInfo.confirm * 1000;
    drawPending();
}

function drawPending() {
    clearInterval(pending.timer);
    $("pending").classList.toggle("hidden", !pending.text);
    if (!pending.text) return;
    $("pendingText").textContent = pending.text;
    const tick = () => {
        if (pending.paused) { $("pendingWhen").textContent = "paused while you speak"; return; }
        const left = Math.ceil((pending.deadline - Date.now()) / 1000);
        if (left <= 0) { sendPending(); return; }
        $("pendingWhen").textContent = "sent to " + ($("sessionName").textContent || "global") + " in " + left + " s";
    };
    tick();
    pending.timer = setInterval(tick, 250);
}

function clearPending() {
    pending.text = "";
    clearInterval(pending.timer);
    $("pending").classList.add("hidden");
}

function sendPending() {
    const text = pending.text;
    clearPending();
    send(text);
}

$("pendingSend").addEventListener("click", sendPending);
$("pendingCancel").addEventListener("click", clearPending);
$("pendingEdit").addEventListener("click", () => {
    const p = $("prompt");
    p.value = (p.value ? p.value + " " : "") + pending.text;
    clearPending();
    autosize();
    p.focus();
});

$("mic").addEventListener("click", () => {
    if (!mic.on) { startMic(); return; }
    stopMic(store.get("micMode", "push") === "push");
});

// ---- the answers read aloud: by claude-cluster (its engine, its voices) or by this device ----
const reading = {active: false, audio: null};
const spoken = {session: "", key: ""};

function stopReading() {
    if (reading.audio) { reading.audio.pause(); reading.audio = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    reading.active = false;
}

function readAnswer(s) {
    // the answer of a turn ended while the page is open, read once: the last one of the session idle, or one followed
    // by the next prompt (a queued turn started at once)
    const messages = s.messages || [];
    const busy = s.state === "working" || s.state === "starting" || s.state === "waiting";
    let found = null;
    for (let i = messages.length - 1; i >= 0 && !found; i--)
        if (messages[i].kind === "assistant" && (!busy || messages.slice(i + 1).some((m) => m.kind === "user"))) found = messages[i];
    const key = found ? found.time + ":" + found.text.length : "";
    if (spoken.session !== s.id) { Object.assign(spoken, {session: s.id, key: key}); return; } // what was there: not read
    if (!found || key === spoken.key) return;
    spoken.key = key;
    const mode = store.get("sayMode", "off");
    if (mode !== "off") speak({text: found.text}, mode);
}

async function speak(what, mode) {
    stopReading();
    try {
        if (mode === "device") {
            const data = await api("/api/say", Object.assign({audio: false}, what));
            if (!data.text || !window.speechSynthesis) return;
            const utter = new SpeechSynthesisUtterance(data.text);
            const langs = {fr: "fr-FR", en: "en-US", es: "es-ES", it: "it-IT", de: "de-DE", pt: "pt-PT", nl: "nl-NL"};
            utter.lang = langs[data.lang] || data.lang;
            utter.onend = () => { reading.active = false; };
            reading.active = true;
            window.speechSynthesis.speak(utter);
            return;
        }
        const response = await fetch("/api/say", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"},
            body: JSON.stringify(Object.assign({audio: true}, what))});
        if (!response.ok || !(response.headers.get("Content-Type") || "").startsWith("audio/")) return;
        const url = URL.createObjectURL(await response.blob());
        reading.audio = new Audio(url);
        reading.active = true;
        reading.audio.onended = () => { reading.active = false; URL.revokeObjectURL(url); };
        await reading.audio.play();
    } catch (error) {
        reading.active = false;
        toast("Not read: " + error.message);
    }
}

// ---- settings of this browser ----
$("micMode").value = store.get("micMode", "push");
$("sayMode").value = store.get("sayMode", "off");
$("micMode").addEventListener("change", (e) => { store.set("micMode", e.target.value); if (mic.on) stopMic(false); });
$("sayMode").addEventListener("change", (e) => {
    store.set("sayMode", e.target.value);
    if (e.target.value !== "off") speak({session: current}, e.target.value); // a sample: the last answer
});
$("settingsButton").addEventListener("click", () => {
    $("settings").classList.toggle("hidden");
    $("voiceNote").textContent = (window.isSecureContext ? "" : "Microphone: needs https (settings page > Web > HTTPS). ")
        + "Speech recognition: " + (voiceInfo.listen || "the default model") + "; voice: " + (voiceInfo.say || "piper")
        + " (settings of claude-cluster > Voice). Cancel / send words work here too.";
});
document.addEventListener("click", (e) => {
    if (!$("settings").contains(e.target) && e.target !== $("settingsButton")) $("settings").classList.add("hidden");
});
if (!window.isSecureContext) $("mic").title = "The microphone needs https (settings page > Web > HTTPS)";

// already connected (the cookie of this browser): straight to the sessions
fetch("/api/state?v=-1", {credentials: "same-origin", cache: "no-store"})
    .then((r) => (r.status === 200 ? showApp() : showLogin()))
    .catch(() => showLogin());
</script>
