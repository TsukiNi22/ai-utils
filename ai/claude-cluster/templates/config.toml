# claude-cluster configuration (~/.config/claude-cluster/config.toml), reloaded live when saved.
# Every key is optional: a missing key keeps its default (the values below).

[ui]
frontend = "auto"          # auto | tty | gui (the --tty / --gui flags win)
layout = "list"            # list (list + active panel) | grid | tabs
style = "html-dark"        # html-light | html-dark | nord | gruvbox | solarized-light | mono, or a [styles.<name>] below
panels = ["skills", "tokens", "context", "cost", "usage", "git"] # default panels of a new session (+ "diff", "tools", "files")
                           # usage: the vendor of the session today / 7 days / lifetime (tokens, cost), limits left
restore = "ask"            # ask | always | never: sessions of the previous run at start (like Firefox)
notify = true              # desktop notifications at all (the ones of the global session too)
notify_global = true       # when the global session answers
notify_done = true         # when a sub-session finishes its turn
notify_permission = true   # when a permission waits
vim = false                # vim mode of the prompt: Esc Normal (hjkl w b e 0 $ x dd dw cw yy p u v V...), i / a / o Insert
paste_lines = 3            # a paste of more lines is one [Pasted text #N +L lines] in the prompt (0: never)
paste_chars = 800          # or of more characters (0: never)
editor = ""                # Ctrl+E; empty: nvim, vim, vi, $VISUAL, $EDITOR, emacs -nw, nano (the first installed)
machine_days = 30          # the map of this computer older than this: a sync proposed at start (0: never)
image_viewer = ""          # right click on an image chip; empty: xdg-open (the viewer of the desktop)
image_preview = "blocks"   # terminal preview on hover: blocks (the pixels as half blocks) | chafa (its symbols)
typewriter = true          # the answers typed as they come, also when the agent sends them at once (false: as received)
typewriter_speed = 400     # characters per second (faster by itself when a long text is behind)

[agent]
# Backend of a new session: "<provider>[/<model>]" (claude-cluster auth list: every provider and its state)
#   claude driver (full: live permissions, MCP, Remote Control): anthropic (= claude, its login), anthropic-api,
#     ollama (local), openrouter, deepseek, kimi, zai, minimax (Anthropic-compatible endpoints)
#   qwen driver (Qwen Code): openai, ollama-openai (OpenAI-compatible endpoints)
#   opencode driver: opencode/<provider>/<model> (its own providers, `opencode auth`)
#   codex driver: codex[/<model>] (OpenAI Codex CLI, `codex login`)
default = "claude"
permission_mode = "auto"   # auto | manual | acceptEdits | plan | dontAsk | bypassPermissions (empty: the default of claude -p, manual)
effort = ""                # thinking / reasoning effort of the new sessions (empty: the default of the agent):
                           #   claude low | medium | high | xhigh | max, codex / opencode minimal | low | medium | high...
                           #   per session: /effort <level>, the palette (Effort), `claude-cluster effort <s> <level>`
allow_bypass = true        # claude: launched with --allow-dangerously-skip-permissions, so bypassPermissions can be chosen
extra_args = []

[commands]                 # programs of the drivers
claude = "claude"
qwen = "qwen"
opencode = "opencode"
codex = "codex"

[models]                   # models offered per provider (palette "Model: ...", /model completion), added to the known
                           # ones (Claude aliases and ids, `ollama list`, `opencode models`); any id works with /model <id>
# anthropic = ["claude-opus-5-1"]
# openai = ["gpt-5", "gpt-5-mini"]
# codex = ["gpt-5-codex"]

[global]
enabled = true
backend = "claude"         # must be a claude-driver provider (the MCP control needs it)
cwd = ""                   # working folder of the global session; empty: a folder of its own
                           #   (~/.local/share/claude-cluster/global, trusted by claude-cluster for Remote Control:
                           #   claude --bg never runs in the home folder)
model = ""
effort = ""                # of the global session at every start (empty: its own /effort, else the one of [agent])
permission_mode = "bypassPermissions" # of the global session, applied at every start: it can do anything without
                           # asking (empty: the mode of [agent])
prompt = "~/.config/claude-cluster/global.md"   # its own system prompt (added to the global CLAUDE.md)
remote_name = "claude-cluster"                  # name of the Remote Control session

[sessions]
trash_days = 14            # a closed session stays restorable this many days
max_parallel = 4           # task queue: sessions working at the same time
budget_usd = 0.0           # 0 = no budget; reached: the session refuses new prompts (notified)
prompt = "~/.config/claude-cluster/sessions.md" # system prompt of every sub-session (claude driver, added to the global
                           # CLAUDE.md; an empty file: none), taken at the next start of each session

[voice]
enabled = false
mode = "push"              # push: push-to-talk key | auto: every sentence heard | wake: only after the wake phrase
wake_word = "ok claude"    # wake mode: phrase(s) that trigger the listening, variants separated by commas
                           #   (speech recognition can bend it: "ok claude, okay claude, hey claude")
wake_seconds = 8           # wake mode: the phrase alone arms the listening this long (the next sentence is the prompt)
wake_reply = ""            # wake mode: spoken when armed (ex: "Oui ?"), empty: silent
only_me = true             # voice-listen --only-me (needs voice-enroll)
confirm_seconds = 3        # the transcription is shown this long before it is sent (0: sent at once)
speak = true               # spoken summary of the answers of the global session
summary_chars = 220
cancel_words = ["annule", "annuler", "stop", "laisse tomber", "oublie", "cancel", "abort", "never mind"]
                           # said alone while a transcription waits: dropped; nothing waits: the answer read stopped
                           # (and the turn of the global session); compared without case, accents nor punctuation
send_words = ["envoie", "envoyer", "envoie le", "valide", "valider", "vas-y", "go", "send", "send it"]
                           # said alone while a transcription waits: sent at once
vocabulary = ""            # proper names written back in every sentence heard (+ the sessions, the projects of the map
                           # of this computer, your names); empty: vocabulary.txt of the config folder
listen_command = "voice-listen"
say_command = "voice-say"
voice_fr = "tom-medium"
voice_en = "en_GB-northern_english_male-medium"

[user]                     # about you, for the global session (asked at the first map of this computer, F9 > User)
nickname = ""
email = ""
editor = ""                # your main editor (Ctrl+E too when [ui] editor is empty)
language = ""              # of the answers: fr | en | empty (the one of the message)
notes = ""                 # anything the global session should know

[service]                  # claude-cluster service enable: "ok claude" opens claude-cluster (voice on) when none runs
frontend = "auto"          # auto: a window (when built with it and a display), else / on its failure a terminal
                           # gui: a window, a terminal on its failure | tty: a terminal only; every failure logged
terminal = ""              # tty: the terminal with its option to run a command ("kitty", "alacritty -e"...), empty: the first installed
voice_mode = "auto"        # the voice of the claude-cluster opened: auto (every sentence) | wake | push
wake_word = ""             # empty: [voice] wake_word
python = "~/.local/share/voice/venv/bin/python"   # the python of voice-listen (sherpa-onnx), its model is used
source = ""                # microphone (PulseAudio / PipeWire source), empty: the default one

[keys]
# action = "key": Ctrl+<letter>, Ctrl+Shift+<letter>, Alt+<letter>, F1..F12, Tab, Escape; alternatives with |
# (most terminals keep Ctrl+Shift+<letter> for themselves: the Alt+ alternative is for them)
palette = "Ctrl+K"
next_session = "Ctrl+N|Alt+N"
prev_session = "Alt+P"
global = "Ctrl+G"
new_session = "Ctrl+T"
close_session = "Ctrl+W"
allow = "Alt+Y"
always = "Alt+A"           # allow and keep the rule
deny = "Alt+D"
interrupt = "Ctrl+C"       # copy when text is selected in the prompt
undo = "Ctrl+Z"
redo = "Ctrl+Y"
select_all = "Ctrl+A"      # Shift+arrows / Ctrl+Shift+arrows select too
cut = "Ctrl+X"
paste = "Ctrl+V"           # text, or an image of the clipboard ([Image #N])
stash = "Ctrl+S"           # put the prompt aside
unstash = "Ctrl+P"         # take the last one back
history = "Ctrl+R"         # prompts sent before
edit = "Ctrl+E"            # the prompt in an editor ([ui] editor, else nvim, vim, vi, $VISUAL, $EDITOR, emacs, nano)
expand = "Ctrl+O"          # transcript: thinking and tool results in full / short
search = "Ctrl+F"          # search in the transcript of the session
mode_cycle = "Shift+Tab"   # next permission mode: auto, acceptEdits, plan, bypassPermissions, manual
help = "F1"                # every key
# fixed: Alt+1..9 session N, Alt+Enter / Shift+Enter new line, Esc (queued prompt back to edit), Esc Esc (clear the prompt)
push_to_talk = "F5"
mute = "F6"
layout = "F2"
settings = "F9"
restore = "Ctrl+Shift+T|Ctrl+Shift+R|Alt+T"   # reopen a closed session (the trash)
prefix = "Ctrl+B"          # then an arrow: session on the left / right / above / below (like tmux)
quit = "Ctrl+Q"

# Own style: [styles.<name>] with the keys of a built-in one (hex colors), then ui.style = "<name>"
# [styles.mine]
# bg = "#16181c"
# surface = "#1c1f24"
# text = "#e6e8eb"
# muted = "#9aa0a6"
# accent = "#7aa2f7"
# border = "#30343b"
# ok = "#3fb950"
# warn = "#d29922"
# error = "#f85149"

# Own provider: [providers.<name>] (driver "claude": Anthropic-compatible, "qwen": OpenAI-compatible)
# [providers.lmstudio]
# driver = "qwen"
# base_url = "http://localhost:1234/v1"
# model = "qwen3-coder-30b"
# key = false              # true: an API key is asked by `claude-cluster auth login lmstudio`

# Profiles: claude-cluster spawn --profile <name> (or from the palette)
# [profiles.libutils]
# cwd = "~/personal_delivery/cpp/libutils"
# backend = "claude/opus"
# permission_mode = "acceptEdits"
# prompt = "Run the unit tests and report the failures"
# extra_args = ["--effort", "high"]
