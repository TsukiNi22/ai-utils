# claude-cluster configuration (~/.config/claude-cluster/config.toml), reloaded live when saved.
# Every key is optional: a missing key keeps its default (the values below).

[ui]
frontend = "auto"          # auto | tty | gui (the --tty / --gui flags win)
layout = "list"            # list (list + active panel) | grid | tabs (window / web page; the terminal shows the list)
style = "html-dark"        # html-light | html-dark | nord | gruvbox | solarized-light | mono, or a [styles.<name>] below
panels = ["skills", "tokens", "context", "cost", "usage", "git"] # default panels of a new session (+ "diff", "tools", "files")
                           # usage: the vendor of the session today / 7 days / lifetime (tokens, cost), limits left
restore = "ask"            # ask | always | never: sessions of the previous run at start (like Firefox)
prompt_origin = true       # the prompts of a transcript coloured by where they come from (+ a label: mcp, task, scheduled); false: all as before
prompt_color_user = ""     # "#rrggbb" of the prompts you type (empty: the accent of the style, as before)
prompt_color_mcp = ""      # of the prompts of the global session and the cluster (session_send / session_spawn, [reply from ...], answers): empty = violet
prompt_color_task = ""     # of the prompts of the tasks and the schedules ([tasks], [scheduled wN]): empty = magenta
notify = true              # desktop notifications at all (the ones of the global session too)
notify_global = true       # when the global session answers
notify_done = true         # when a sub-session finishes its turn
notify_permission = true   # when a permission waits
notify_sound = true        # a short sound with them (the sounds of the desktop theme, one per kind)
notify_when = "unfocused"  # unfocused: only when claude-cluster is not in front (its popups are) | always
notify_question = true     # a question of an agent (its options as buttons)
notify_error = true        # an error, a crash, the safety check
notify_limits = true       # a limit close (80 / 95 %) or reached
notify_web = true          # a device asks to connect / connected (web access)
notify_tasks = true        # the task queue done
notify_reminders = true    # a reminder (schedule add --notify)
notify_app = true          # the same notifications published to the Android app (each phone opts in, its kinds in This device)
notify_ready = true        # something slow ready: claude-cluster started, the speech model loaded, the map written
vim = false                # vim mode of the prompt: Esc Normal (hjkl w b e 0 $ x dd dw cw yy p u v V...), i / a / o Insert
paste_lines = 3            # a paste of more lines is one [Pasted text #N +L lines] in the prompt (0: never)
paste_chars = 800          # or of more characters (0: never)
editor = ""                # Ctrl+E; empty: nvim, vim, vi, $VISUAL, $EDITOR, emacs -nw, nano (the first installed)
machine_days = 30          # the map of this computer older than this: a sync proposed at start (0: never)
image_viewer = ""          # right click on an image chip; empty: xdg-open (the viewer of the desktop)
image_preview = "blocks"   # terminal preview on hover: blocks (the pixels as half blocks) | chafa (its symbols)
typewriter = true          # the answers typed as they come, also when the agent sends them at once (false: as received)
typewriter_speed = 400     # characters per second (faster by itself when a long text is behind)

[agent]
# Provider of EVERY session: the global session, every sub-session (existing ones at the next start, new ones, imported
# conversations): "<provider>[/<model>]" (claude-cluster auth list: every provider and its state). Applied at the next start.
# The global session needs a claude driver one. Replaces the old [agent] default and [global] backend (still read when
# this key is missing). A session of another driver (codex, opencode, qwen) keeps its own: its conversation needs it.
#   claude driver (full: live permissions, MCP, Remote Control): anthropic (= claude, its login), anthropic-api,
#     ollama (local), openrouter, deepseek, kimi, zai, minimax (Anthropic-compatible endpoints)
#   qwen driver (Qwen Code): openai, ollama-openai (OpenAI-compatible endpoints)
#   opencode driver: opencode/<provider>/<model> (its own providers, `opencode auth`)
#   codex driver: codex[/<model>] (OpenAI Codex CLI, `codex login`)
provider = "claude"
permission_mode = "auto"   # auto | manual | acceptEdits | plan | dontAsk | bypassPermissions (empty: the default of claude -p, manual)
effort = ""                # thinking / reasoning effort of the new sessions (empty: the default of the agent):
                           #   claude low | medium | high | xhigh | max, codex / opencode minimal | low | medium | high...
                           #   per session: /effort <level>, the palette (Effort), `claude-cluster effort <s> <level>`
allow_bypass = true        # claude: launched with --allow-dangerously-skip-permissions, so bypassPermissions can be chosen
extra_args = []

[commands]                 # programs of the drivers
claude = "claude"
qwen = "qwen"
opencode = "opencode"
codex = "codex"

[models]                   # models offered per provider (palette "Model: ...", /model completion), added to the known
                           # ones (Claude aliases and ids, `ollama list`, `opencode models`); any id works with /model <id>
# anthropic = ["claude-opus-5-1"]
# openai = ["gpt-5", "gpt-5-mini"]
# codex = ["gpt-5-codex"]

[global]
enabled = true
cwd = ""                   # working folder of the global session; empty: a folder of its own
                           #   (~/.local/share/claude-cluster/global, trusted by claude-cluster for Remote Control:
                           #   claude --bg never runs in the home folder)
model = ""
effort = ""                # of the global session at every start (empty: its own /effort, else the one of [agent])
permission_mode = "bypassPermissions" # of the global session, applied at every start: it can do anything without
                           # asking (empty: the mode of [agent])
prompt = "~/.config/claude-cluster/global.md"   # its own system prompt (added to the global CLAUDE.md)
remote_name = "claude-cluster"                  # name of the Remote Control session

[sessions]
trash_days = 14            # a closed session stays restorable this many days
max_parallel = 4           # task queue: sessions working at the same time
budget_usd = 0.0           # 0 = no budget; reached: the session refuses new prompts (notified)
questions_to_global = true # a question of the agent of a sub-session shown on the global session (its own one greyed);
                           # answered with the keys, the mouse or the voice
global_answers = false     # the global session is told those questions and may choose their answer
bypass_to_global = true    # the permissions a sub-session in bypassPermissions still asks (safety check of Claude Code):
                           # decided by the global session (it asks you when unsure); off: you answer them
global_fork = false        # the global session may fork a sub-session (MCP session_fork); you can always (palette, fork)
rewrite_global_prompt = false    # the global session may rewrite its own system prompt (MCP config_write global_prompt); old key global_prompts: same, as fallback
rewrite_sessions_prompt = true   # the global session may rewrite the system prompt of the sub-sessions (MCP config_write sessions_prompt)
archive_one_shot = true   # a session the global session started for ONE task (session_spawn one_shot) is closed to the trash (restorable) once its
                           # answer is relayed; kept when you typed in it, look at it or it waits for you; off: the flag is ignored
global_edit = false        # the global session may rewrite the conversation of a sub-session (MCP session_edit)
prompt = "~/.config/claude-cluster/sessions.md" # system prompt of every sub-session (claude driver, added to the global
                           # CLAUDE.md; an empty file: none), taken at the next start of each session

[voice]
enabled = false
mode = "push"              # push: push-to-talk key | auto: every sentence heard | wake: only after the wake phrase
wake_word = "ok claude"    # wake mode: phrase(s) that trigger the listening, variants separated by commas
                           #   (speech recognition can bend it: "ok claude, okay claude, hey claude")
wake_seconds = 8           # wake mode: the phrase alone arms the listening this long (the next sentence is the prompt)
wake_reply = ""            # wake mode: spoken when armed (ex: "Oui ?"), empty: silent
only_me = true             # voice-listen --only-me (needs voice-enroll)
confirm_seconds = 3        # the transcription is shown this long before it is sent (0: sent at once)
speak = true               # spoken summary of the answers of the global session
summary_chars = 220
# The engines (settings page > Voice: what each one handles, its limits, its free use, its link; claude-cluster engines)
listen_model = ""          # speech to text, voice-listen --model: local parakeet (French, English, mixed) | whisper (99
                           # languages, slower) | kroko-fr (French only, live text, the fastest); free-tier APIs groq
                           # (Whisper large, 8 h a day) | deepgram (Nova-3, $200 of credit), their key: claude-cluster
                           # auth login groq; empty: the choice of voice-models
listen_language = ""       # the language spoken, for whisper / groq / deepgram (fr, en...); empty: found by the model
end_silence = 0.0          # seconds of silence ending a sentence (0: the one of voice-listen, 1.0): a shorter pause
                           # goes on the same sentence, two sentences said in a row are one prompt
words = ""                 # the cancel / send words said alone while a transcription waits (settings page > Voice >
                           # Voice words (edit)); empty: voice-words.txt of the config folder
cancel_words = []          # more cancel words here, added to the file
send_words = []            # more send words here, added to the file
vocabulary = ""            # proper names written back in every sentence heard (+ the sessions, the projects of the map
                           # of this computer, your names); empty: vocabulary.txt of the config folder
listen_command = "voice-listen"
say_command = "voice-say"
say_engine = "piper"       # text to speech: local piper (instant, synthetic) | kokoro (natural, ~1 s a sentence: voice-models
                           # install kokoro); free-tier APIs elevenlabs | cartesia (claude-cluster auth login cartesia);
                           # an engine failing (no key, quota, model missing): Piper
say_voices = ""            # the voice of that engine per language: "fr=ff_siwis, en=bf_emma" (voice-tts --list kokoro);
                           # another engine for a language: "es=kokoro:ef_dora"; a language missing: the engine's default
voice_fr = "tom-medium"    # the Piper voices (say_engine = piper, and the fallback of the others)
voice_en = "en_GB-northern_english_male-medium"

[web]                      # the devices of this LAN drive claude-cluster (palette: Web access, claude-cluster web on, --web)
enabled = false            # opened at each start; the code (6 digits) and the address shown at the top of the interface
port = 8787                # several devices at once; private addresses of the same subnet only (never the internet)
https = true               # TLS, certificate of its own (~/.config/claude-cluster/web): encrypted, the microphone of the page allowed
approve = true             # a new device: its code, then your yes here (allow, allow and trust, deny); the trusted ones: neither

[attachments]              # files, images and photos attached to a prompt (paperclip, drop, paste; the app: the camera) (F9 > Attachments)
enabled = true
max_mb = 20                # the largest file; a bigger one is refused
max_files = 10             # per prompt
keep = 200                 # kept per session (the oldest go; all go when the session is deleted; 0: all kept)
max_pixels = 2048          # a larger image is downscaled to this side before it is stored (0: as it is); needs ImageMagick
strip_exif = true          # images re-encoded without EXIF (GPS, camera); needs ImageMagick
dir = ""                   # stored where, one folder per session (empty: <data>/attachments)
link = true                # a file of this computer linked by its path (nothing copied): window, terminal, a page on this computer
global = true              # the global session may attach a local file to a prompt (project folder / home only, no hidden folder)
global_max = 5             # files per prompt of the global session

[mcp]                      # MCP of the global session (F9 > MCP)
servers = []               # custom servers it gets too: "name: command args" (stdio; env VAR=value command... for its
                           # variables) | "name: https://url" (HTTP); its tools: mcp__<name>__*; at its next start

[mcp_tools]                # a tool of claude-cluster off for the global session: <tool> = false (refused at once, out of
                           # its list at its next start); every tool on when missing

[user]                     # about you, for the global session (asked at the first map of this computer, F9 > User)
nickname = ""
email = ""
editor = ""                # your main editor (Ctrl+E too when [ui] editor is empty)
language = ""              # of the answers: fr | en | empty (the one of the message)
notes = ""                 # anything the global session should know

[service]                  # claude-cluster service enable: "ok claude" opens claude-cluster (voice on) when none runs
frontend = "auto"          # auto: a window (when built with it and a display), else / on its failure a terminal
                           # gui: a window, a terminal on its failure | tty: a terminal only; every failure logged
terminal = ""              # tty: the terminal with its option to run a command ("kitty", "alacritty -e"...), empty: the first installed
voice_mode = "auto"        # the voice of the claude-cluster opened: auto (every sentence) | wake | push
wake_word = ""             # empty: [voice] wake_word
python = "~/.local/share/voice/venv/bin/python"   # the python of voice-listen (sherpa-onnx), its model is used
source = ""                # microphone (PulseAudio / PipeWire source), empty: the default one

[keys]
# action = "key": Ctrl+<letter>, Ctrl+Shift+<letter>, Alt+<letter>, F1..F12, Tab, Escape; alternatives with |
# (most terminals keep Ctrl+Shift+<letter> for themselves: the Alt+ alternative is for them)
palette = "Ctrl+K"
next_session = "Ctrl+N|Alt+N"
prev_session = "Alt+P"
global = "Ctrl+G"
new_session = "Ctrl+T"
close_session = "Ctrl+W"
allow = "Alt+Y"
always = "Alt+A"           # allow and keep the rule
deny = "Alt+D"
interrupt = "Ctrl+C"       # copy when text is selected in the prompt
undo = "Ctrl+Z"
redo = "Ctrl+Y"
select_all = "Ctrl+A"      # Shift+arrows / Ctrl+Shift+arrows select too
cut = "Ctrl+X"
paste = "Ctrl+V"           # text, or an image of the clipboard ([Image #N])
stash = "Ctrl+S"           # put the prompt aside
unstash = "Ctrl+P"         # take the last one back
history = "Ctrl+R"         # prompts sent before
edit = "Ctrl+E"            # the prompt in an editor ([ui] editor, else nvim, vim, vi, $VISUAL, $EDITOR, emacs, nano)
expand = "Ctrl+O"          # transcript: thinking and tool results in full / short
search = "Ctrl+F"          # search in the transcript of the session
mode_cycle = "Shift+Tab"   # next permission mode: auto, acceptEdits, plan, bypassPermissions, manual
help = "F1"                # every key
transcript_top = "Shift+PageUp|Ctrl+Home"        # jump to the first message (many terminals keep Shift+PageUp for their scrollback: Ctrl+Home arrives)
transcript_bottom = "Shift+PageDown|Ctrl+End"    # jump to the end, new output scrolls into view again
session_up = "Alt+Up"                # session above / next in the list (the list and the grid scroll to keep it in view)
session_down = "Alt+Down"
session_left = "Alt+Left"            # session on the left (grid) / previous one in the list
session_right = "Alt+Right"
grid_open = "Shift+Enter|Alt+O"      # grid: open the focused session in the list layout (Shift+Enter needs a terminal that reports it: kitty, foot, wezterm...; Alt+O always)
session_page_up = "Alt+PageUp"       # a page of sessions up / down (the grid: its rows), also after the prefix: PageUp / PageDown / Home / End
session_page_down = "Alt+PageDown"
session_first = "Alt+Home"           # the first / the last session
session_last = "Alt+End"
# fixed: Alt+1..9 session N, Alt+Enter / Shift+Enter new line, Esc (queued prompt back to edit), Esc Esc (clear the prompt)
push_to_talk = "F5"
mute = "F6"
layout = "F2"
settings = "F9"
stats = "F10"
restore = "Ctrl+Shift+T|Ctrl+Shift+R|Alt+T"   # reopen a closed session (the trash)
prefix = "Ctrl+B"          # then an arrow: session on the left / right / above / below (like tmux)
quit = "Ctrl+Q"

# Own style: [styles.<name>] with the keys of a built-in one (hex colors), then ui.style = "<name>"
# [styles.mine]
# bg = "#16181c"
# surface = "#1c1f24"
# text = "#e6e8eb"
# muted = "#9aa0a6"
# accent = "#7aa2f7"
# border = "#30343b"
# ok = "#3fb950"
# warn = "#d29922"
# error = "#f85149"

# Own provider: [providers.<name>] (driver "claude": Anthropic-compatible, "qwen": OpenAI-compatible)
# [providers.lmstudio]
# driver = "qwen"
# base_url = "http://localhost:1234/v1"
# model = "qwen3-coder-30b"
# key = false              # true: an API key is asked by `claude-cluster auth login lmstudio`

# Profiles: claude-cluster spawn --profile <name> (or from the palette)
# [profiles.libutils]
# cwd = "~/personal_delivery/cpp/libutils"
# backend = "claude/opus"
# permission_mode = "acceptEdits"
# prompt = "Run the unit tests and report the failures"
# extra_args = ["--effort", "high"]

[limits]
# What the sessions may spend together (the USD of the usage ledger); 0 = no limit. Settings > Accounts & limits.
daily_usd = 0.0            # since the local midnight
weekly_usd = 0.0           # the last 7 days
monthly_usd = 0.0          # since the 1st of the local month
scope = "keys"             # keys: only what an API key is billed for | all: every turn, the notional cost of a subscription too
block = true               # a limit reached: the prompts are refused (send --force passes); false: only warned
warn_percent = 80          # warned at this share of a limit (0: only when it is reached)

[policy]
# The model / thinking policy of the global session (Settings > Model policy): what it may choose for the sub-sessions.
# It runs on [global] model / effort itself (until you change them); it sets the model and the thinking of the sub-sessions
# by the difficulty of each task, and asks you first for the costly ones (below).
default_model = ""         # the model sub-sessions start from (empty: none)
default_effort = ""        # the thinking effort they start from (empty: the default of the agent)
model_mode = "advise"      # free: no default, by the task | advise: the default is the start, deviate for a reason | force: nothing else
effort_mode = "advise"
allowed_models = []        # the only models it may choose (empty: every one), by name or a part of it: ["haiku", "sonnet"]
allowed_efforts = []       # the only efforts (empty: every one)
ask_costly = true          # a costly model / effort: you decide each time (Allow / Deny)
costly_models = ["opus", "fable"]    # models that cost as much or more
costly_efforts = ["xhigh", "max"]    # efforts of this level or above
