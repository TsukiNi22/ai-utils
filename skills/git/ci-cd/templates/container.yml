name: Image - {{IMAGE_NAME}} (CD)

on:
  push:
    branches: [main]
    paths:
      - '{{IMAGE_NAME}}.Dockerfile'
      - '.github/workflows/{{WORKFLOW_FILE}}'

env:
  IMAGE_NAME: "{{IMAGE_NAME}}"
  VERSION: v1.0.0 # bumped with the CHANGELOG of the image

jobs:
  build-image:
    runs-on: ${{ vars.RUNNER }}
    permissions:
      packages: write
      contents: write

    steps:
      - run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push the image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./${{ env.IMAGE_NAME }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version tag
        run: |
          set -euo pipefail
          if git ls-remote --tags origin | grep -q "refs/tags/${IMAGE_NAME}/${VERSION}$"; then
            echo "::warning::The tag ${IMAGE_NAME}/${VERSION} already exists on the remote."
            exit 0
          fi
          git tag "${IMAGE_NAME}/${VERSION}"
          git push origin "${IMAGE_NAME}/${VERSION}"
